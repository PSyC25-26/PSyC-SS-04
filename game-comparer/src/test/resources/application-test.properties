# -------------------------------------------------------
# Perfil de test — src/test/resources/application-test.properties
# -------------------------------------------------------

test.mensaje=El perfil test está activo

# Credenciales IGDB dummy para que IgdbTokenService pueda instanciarse
igdb.client-id=dummy-client-id
igdb.client-secret=dummy-client-secret

# Deshabilita completamente Spring Security en el contexto de test
#security.ignored=/**

spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

# Base de datos en memoria H2 para tests (sin necesidad de MySQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.sql.init.mode=never